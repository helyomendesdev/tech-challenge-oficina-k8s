apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "sua-chave-aqui"
  POSTGRES_DB: "oficina"
  POSTGRES_USER: "oficina_admin"
  POSTGRES_PASSWORD: "sua-senha"
  # Salt do hash de CPF nos logs/eventos (cliente.ref). Valor aleatorio, exclusivo por
  # ambiente e nunca compartilhado entre homologacao e producao.
  OBSERVABILIDADE_SALT: "gere-um-valor-aleatorio-por-ambiente"
---
# Licenca do New Relic — valor passado por canal privado, nunca versionado.
# Criar com:
#   kubectl create secret generic newrelic-license -n oficina --from-literal=NEW_RELIC_LICENSE_KEY=<chave>
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-license
  namespace: oficina
type: Opaque
stringData:
  NEW_RELIC_LICENSE_KEY: "sua-licenca-new-relic"
